<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.nav == 'recipes' %} aria-current="page"{% endif %}>Recipes</a>
      <a href="{{ '/plan/' | relative_url }}"{% if page.nav == 'plan' %} aria-current="page"{% endif %}>Plan</a>
      <a href="{{ '/shopping/' | relative_url }}"{% if page.nav == 'shopping' %} aria-current="page"{% endif %}>Shopping</a>
    </nav>
  </header>
  <main class="wrap {{ page.body_class }}">
    {{ content }}
  </main>
</body>
</html>
