# Two-week cycle. Repeat Weeks 1-2 for Weeks 3-4 and Weeks 5-6.
# Each meal is a recipe code. An optional *_label overrides the recipe title.
# kcal is the day total per person, from each recipe's kcal_num (or the label's figure).
weeks:
  - name: Week 1
    days:
      - { day: Mon, b: B3, s: S2, l: L10, t: T14, kcal: "1,355" }
      - { day: Tue, b: B1, s: S3, l: L2, t: T12, kcal: "1,355", t_label: "Beef & Green Lentil Ragu with Spaghetti (batch cook, save half)" }
      - { day: Wed, b: B3, s: S1, l: L7, t: T11, kcal: "1,380", l_label: "Leftover Ragu with a Big Salad (~350 kcal)" }
      - { day: Thu, b: B4, s: S5, l: L5, t: T16, kcal: "1,365", t_label: "Chicken, Tenderstem & Hollandaise with New Potatoes (cook about 250g extra chicken for Friday)" }
      - { day: Fri, b: B3, s: S12, l: L1, t: T10, kcal: "1,330" }
      - { day: Sat, b: B12, s: S6, l: L8, t: T13, kcal: "1,370", l_label: "Yellow Split Pea & Bacon Soup (batch cook, save half)" }
      - { day: Sun, b: B5, s: S9, l: L8, t: T15, kcal: "1,340", l_label: "Leftover Split Pea Soup with Garlic Bread (~380 kcal)" }
  - name: Week 2
    days:
      - { day: Mon, b: B1, s: S2, l: L2, t: T9, kcal: "1,350" }
      - { day: Tue, b: B3, s: S3, l: L10, t: T3, kcal: "1,385", t_label: "Lean Beef Chilli with Rice (batch cook, save extra)" }
      - { day: Wed, b: B10, s: S4, l: L7, t: T8, kcal: "1,365", l_label: "Leftover Chilli & Rice", t_label: "Chicken Souvlaki Flatbreads (grill about 250g extra chicken for Thursday)" }
      - { day: Thu, b: B3, s: S5, l: L1, t: T1, kcal: "1,380" }
      - { day: Fri, b: B4, s: S6, l: L5, t: T2, kcal: "1,380" }
      - { day: Sat, b: B2, s: S12, l: L9, t: T6, kcal: "1,395", l_label: "Yellow Split Pea Dhal with Flatbread (batch cook, save half)" }
      - { day: Sun, b: B12, s: S7, l: L9, t: T5, kcal: "1,425", l_label: "Leftover Dhal with Flatbread" }
